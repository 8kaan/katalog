<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aventis Catalog</title>

    <!-- Core External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Turn.js Plugin (Local) -->
    <script src="/src/lib/turn.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;700;900&family=Raleway:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Core Styles -->
    <link rel="stylesheet" href="/src/style.css">
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
</head>

<body class="is-loading">
    <div id="loading-overlay">
        <div class="brand-entrance">
            <img src="/emblem.svg" class="splash-emblem" onerror="this.style.display='none'; document.getElementById('splash-text-fallback').style.display='block';">
            <h1 id="splash-text-fallback" class="brand-logo" style="display: none;">Aventis</h1>
            <div class="brand-shimmer"></div>
        </div>
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <!-- V590: Hidden loading message for a cleaner branded look -->
            <p id="loading-text" style="display: none;">KATALOG YÜKLENİYOR...</p>
            <div id="loading-progress-container" style="display: none;">
                <div id="loading-progress-bar"></div>
            </div>
            <p id="status-msg"
                style="color: #ff453a; font-size: 11px; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px;">
            </p>
        </div>
    </div>

    <!-- V224: Unified Top AppBar -->
    <div id="top-bar" class="app-bar top">
        <div class="top-bar-center-logo">
            <img src="/emblem.svg" class="top-bar-emblem-img" onerror="this.style.display='none';">
        </div>

        <!-- Unified Top Navigation Group -->
        <div id="top-nav-group" class="top-nav-controls">
            <div id="search-wrapper">
                <div id="search-box">
                    <div id="search-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </div>
                    <input type="text" id="global-search-input" placeholder="ARA" autocomplete="off" inputmode="none">
                </div>
                <!-- V912: Inline Validation Anchor -->
                <div id="search-error" class="search-error-msg">En az 3 harf içeren bir arama yapınız.</div>
            </div>

            <button id="back-to-library" class="btn-glass" title="Kataloglara Dön" style="display: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="btn-text">KATALOGLAR</span>
            </button>
        </div>

    </div>

    <!-- V206: SEARCH RESULTS PANEL -->
    <div id="search-panel" class="modal-hidden">
        <div class="search-header">
            <h3>ARAMA SONUÇLARI</h3>
            <div id="search-results-info"><span id="search-total-count">0</span> sonuç bulundu</div>
            <div id="search-panel-close">&times;</div>
        </div>
        <div id="search-results-list">
            <!-- Dynamic Results -->
        </div>
    </div>

    <!-- V150: Page Selector Modal -->
    <div id="page-selector-modal" class="modal-wrapper modal-hidden">
        <div class="modal-container">
            <div class="modal-header">
                <h3>SAYFA SEÇ</h3>
                <button id="page-selector-close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="selector-input-group">
                    <input type="number" id="page-selector-input" min="1" placeholder="Sayfa No..." inputmode="none">
                    <button id="page-selector-confirm">GİT</button>
                </div>
                <div id="page-selector-grid">
                    <!-- Dynamic Buttons -->
                </div>
            </div>
        </div>
    </div>



    <!-- LIBRARY VIEW (V85) -->
    <div id="library-view">
        <header class="library-header">
            <!-- V442: Top-Left Brand Logo -->
            <a href="javascript:void(0)" class="library-top-left-logo" style="text-decoration: none; display: block;">
                <img src="/logo.svg" class="lib-logo-img" onerror="this.style.display='none';">
            </a>
            <div class="header-logo">AVENTIS<span>CATALOG</span></div>
            <div class="header-status" id="library-status">TÜM KATALOGLAR</div>
        </header>

        <div id="catalog-grid">
            <!-- JS Dynamic Content -->
        </div>
    </div>

    <div id="viewport">
        <div id="zoom-viewport">
            <button id="side-nav-prev" class="side-nav-btn" title="Geri">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <button id="side-nav-next" class="side-nav-btn" title="İleri">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>

            <div id="zoom-content">
                <div id="flipbook-container" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- V1020: MODERN VIRTUAL KEYBOARD -->
    <div id="virtual-keyboard" class="keyboard-hidden">
        <div class="keyboard-inner">
            <div id="keyboard-rows"></div>
            
            <div class="keyboard-footer">
                <!-- V1020: Icon-based Action Buttons -->
                <div id="kb-clear" class="kb-btn action" title="Hepsini Temizle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </div>
                
                <div id="kb-space" class="kb-btn action">BOŞLUK</div>
                
                <div id="kb-backspace" class="kb-btn action" title="Geri Sil">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
                </div>
                
                <div id="kb-search" class="kb-btn primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span>ARA</span>
                </div>

                <!-- V1023: Close button relocated to footer next to Search -->
                <div id="kb-close" class="kb-btn action kb-btn-close" title="Kapat">×</div>
            </div>
        </div>
    </div>

    <!-- V224: Unified Bottom AppBar -->
    <div id="bottom-bar" class="app-bar bottom" style="display: none;">
        <div id="controls">
            <div class="control-group">
                <button id="zoom-out" title="Uzaklaştır">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button id="zoom-in" title="Yakınlaştır">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>

            <div id="page-nav" class="control-group">
                <button id="first-btn" title="En Başa">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="11 17 6 12 11 7"></polyline>
                        <polyline points="18 17 13 12 18 7"></polyline>
                    </svg>
                </button>
                <button id="prev-btn" title="Geri">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>

                <div id="page-display">
                    <span id="page-info">YÜKLENİYOR...</span>
                </div>

                <button id="next-btn" title="İleri">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
                <button id="last-btn" title="En Sona">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="13 17 18 12 13 7"></polyline>
                        <polyline points="6 17 11 12 6 7"></polyline>
                    </svg>
                </button>
            </div>

            <div class="control-group">
                <button id="toggle-fullscreen" title="Tam Ekran">
                    <svg class="fs-icon-enter" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
                        </path>
                    </svg>
                    <svg class="fs-icon-exit" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- V346: CUSTOM DIALOG ENGINE -->
    <div id="custom-dialog" class="modal-wrapper modal-hidden" style="z-index: 20000;">
        <div class="modal-container" style="max-width: 400px;">
            <div class="modal-header">
                <h3 id="dialog-title">BAŞLIK</h3>
                <button id="dialog-close"
                    onclick="document.getElementById('custom-dialog').classList.add('modal-hidden')">&times;</button>
            </div>
            <div class="modal-body">
                <p id="dialog-msg" style="margin-bottom: 20px; opacity: 0.8; line-height: 1.5;"></p>
                <div id="dialog-prompt-container" style="display: none; margin-bottom: 20px;">
                    <input type="text" id="dialog-input"
                        style="width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); padding:12px; border-radius:8px; color:white; outline:none; box-sizing: border-box;">
                </div>
                <div class="dialog-actions" style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button id="dialog-cancel" class="btn-glass" style="padding: 10px 20px;">İPTAL</button>
                    <button id="dialog-confirm" class="btn-accent"
                        style="padding: 10px 20px; background: var(--accent-color); color: black; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">TAMAM</button>
                </div>
            </div>
        </div>
    </div>



    <script type="module" src="/src/main.js"></script>
</body>

</html>
